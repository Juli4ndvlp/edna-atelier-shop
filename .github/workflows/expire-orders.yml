name: Expirar pedidos reservados

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: expire-orders
  cancel-in-progress: false

jobs:
  expire-orders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar al endpoint de expiración
        env:
          CRON_URL: ${{ secrets.COBIJO_CRON_URL }}
          CRON_SECRET: ${{ secrets.COBIJO_CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Faltan los secrets COBIJO_CRON_URL o COBIJO_CRON_SECRET del repositorio"
            exit 1
          fi

          if ! python3 -c 'from urllib.parse import urlsplit; import sys; u = urlsplit(sys.argv[1]); sys.exit(0 if u.scheme == "https" and u.hostname and u.path == "/api/cron/expire-orders" and not u.username and not u.password and not u.query and not u.fragment else 1)' "$CRON_URL"; then
            echo "::error::COBIJO_CRON_URL debe ser HTTPS y apuntar exactamente a /api/cron/expire-orders"
            exit 1
          fi

          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          status=$(curl --silent --show-error --proto '=https' --connect-timeout 10 --max-time 30 \
            --output "$response_file" \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$CRON_URL")

          cat "$response_file"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::El endpoint respondió HTTP $status"
            exit 1
          fi

          if ! python3 -c 'import json, sys; data = json.load(open(sys.argv[1], encoding="utf-8")); sys.exit(0 if data.get("ok") is True else 1)' "$response_file"; then
            echo "::error::El endpoint no devolvió JSON con ok=true"
            exit 1
          fi
